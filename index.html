<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trajes de baño 2026/27</title>
<meta name="description" content="Catálogo de trajes de baño Primavera-Verano 2026/27 con precios. Pedí por WhatsApp.">
<meta property="og:title" content="Trajes de baño · Primavera-Verano 2026/27">
<meta property="og:description" content="Mirá el catálogo con precios y pedí por WhatsApp.">
<meta property="og:image" content="img/portada.jpg">
<meta name="theme-color" content="#fdf8e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3ecc8;
    --card: #fffbea;
    --ink: #3f4a63;
    --accent: #6d80a4;
    --muted: #8a93a8;
    --wa: #1faa59;
    --line: #e6dcae;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Montserrat", system-ui, sans-serif; font-size: 15px;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; cursor: pointer; }

  .hero { position: relative; max-width: 1100px; margin: 0 auto; padding: 16px 16px 0; }
  .hero-img { border-radius: 28px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--card); }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
  .hero h1 {
    margin: 18px 0 2px; font-weight: 300; font-size: 26px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent); text-align: center;
  }
  .hero p { margin: 0; text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }

  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 10px; max-width: 1100px; margin: 0 auto;
  }
  .search-row { display: flex; gap: 8px; }
  .search {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 11px 16px; font: inherit; color: var(--ink); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn-talles {
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grid {
    max-width: 1100px; margin: 0 auto; padding: 6px 16px 100px;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
  }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .item {
    background: var(--card); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
    border: 0; padding: 0; text-align: left; color: inherit;
  }
  .thumb { aspect-ratio: 1; background: #f8f1d6; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.wide img { object-fit: contain; }
  .badge {
    position: absolute; top: 8px; left: 8px; background: #fff; color: var(--accent);
    font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; letter-spacing: .05em;
  }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .code { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .name { font-size: 13px; line-height: 1.3; text-transform: uppercase; letter-spacing: .03em; flex: 1; }
  .price { font-size: 19px; font-weight: 700; color: var(--accent); margin-top: 4px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

  .wa-float {
    position: fixed; right: 16px; bottom: 16px; z-index: 6; background: var(--wa); color: #fff;
    border-radius: 999px; padding: 12px 18px; font-weight: 600; text-decoration: none;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .wa-float svg, .wa-btn svg { width: 20px; height: 20px; fill: currentColor; }

  dialog {
    border: 0; padding: 0; width: min(560px, 100vw); max-width: 100vw; max-height: 100dvh;
    margin: auto auto 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink);
  }
  @media (min-width: 700px) { dialog { margin: auto; border-radius: 24px; max-height: 92dvh; } }
  dialog::backdrop { background: rgba(40, 45, 60, .55); }
  .sheet { display: flex; flex-direction: column; max-height: inherit; }
  .sheet-scroll { overflow-y: auto; }
  .close {
    position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.92); color: var(--ink); font-size: 20px; line-height: 1;
  }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #f8f1d6; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: none; width: 100%; scroll-snap-align: center; object-fit: contain; max-height: 62dvh; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0 0; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--accent); }
  .detail { padding: 12px 18px 8px; }
  .detail .code { font-size: 13px; }
  .detail h2 { margin: 2px 0 4px; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .detail .price { font-size: 26px; margin: 0 0 10px; }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 7px 12px; font-size: 13px;
  }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sheet-foot { padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }
  .wa-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: var(--wa); color: #fff; text-decoration: none; font-weight: 600;
    border-radius: 999px; padding: 14px; font-size: 16px;
  }
  .talles-body { padding: 18px; display: grid; gap: 14px; }
  .talles-body h2 { margin: 0; font-weight: 400; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; font-size: 18px; }
  .talles-body img { border-radius: 16px; width: 100%; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 90px; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-img"><img src="img/portada.jpg" alt="Trajes de baño Primavera-Verano 2026/27"></div>
  <h1>Trajes de baño</h1>
  <p>Primavera · Verano 2026/27</p>
</header>

<div class="bar">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Buscar por nombre o código" autocomplete="off">
    <button class="btn-talles" id="btnTalles" type="button">Talles</button>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Categorías"></div>
</div>

<main class="grid" id="grid"></main>
<footer>Precios sujetos a cambio sin previo aviso.</footer>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3c.2-.6.2-1.1.1-1.2l-.5-.3Z"/></svg>
  Consultas
</a>

<dialog id="dlg">
  <div class="sheet">
    <button class="close" type="button" aria-label="Cerrar" data-close>×</button>
    <div class="sheet-scroll">
      <div class="gallery" id="gal"></div>
      <div class="dots" id="dots"></div>
      <div class="detail">
        <div class="code" id="dCode"></div>
        <h2 id="dName"></h2>
        <div class="price" id="dPrice"></div>
        <div class="field"><label>Talle</label><div class="opts" id="dSizes"></div></div>
        <div class="field"><label>Color</label><div class="opts" id="dColors"></div></div>
      </div>
    </div>
    <div class="sheet-foot">
      <a class="wa-btn" id="dWa" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3c.2-.6.2-1.1.1-1.2l-.5-.3Z"/></svg>
        Lo quiero
      </a>
    </div>
  </div>
</dialog>

<dialog id="dlgTalles">
  <div class="sheet">
    <button class="close" type="button" aria-label="Cerrar" data-close>×</button>
    <div class="sheet-scroll talles-body">
      <h2>Guía de talles</h2>
      <img src="img/talles-adultos.jpg" alt="Tabla de talles: corpiños, bombachas, enteras y tankinis" loading="lazy">
      <img src="img/talles-infantiles.jpg" alt="Tabla de talles: mallas infantiles" loading="lazy">
    </div>
  </div>
</dialog>

<script src="data.js"></script>
<script>
  const WA = "5491165843688";
  const CATS = ["Todo", "Conjuntos", "Corpiños y tops", "Bombachas y tangas", "Enteras y tankinis", "Niñas y teens"];
  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + n.toLocaleString("es-AR");
  const nice = (s) => s.charAt(0) + s.slice(1).toLowerCase();
  const waLink = (text) => `https://wa.me/${WA}?text=${encodeURIComponent(text)}`;

  let cat = "Todo";
  let query = "";

  $("waFloat").href = waLink("¡Hola! Vi el catálogo de trajes de baño y quería hacer una consulta.");

  $("chips").innerHTML = CATS.map((c) =>
    `<button class="chip" type="button" aria-pressed="${c === cat}" data-cat="${c}">${c}</button>`).join("");
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    cat = b.dataset.cat;
    document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  function render() {
    const list = PRODUCTOS.filter((p) =>
      (cat === "Todo" || p.cat === cat) &&
      (!query || p.name.toLowerCase().includes(query) || p.code.includes(query)));
    $("grid").innerHTML = list.length ? list.map((p) => `
      <button class="item" type="button" data-code="${p.code}">
        <div class="thumb${p.wide ? " wide" : ""}">
          <img src="${p.imgs[0]}" alt="${p.name}" loading="lazy">
          ${p.nuevo ? '<span class="badge">NUEVO</span>' : ""}
        </div>
        <div class="info">
          <span class="code">ART. ${p.code}</span>
          <span class="name">${p.name}</span>
          <span class="price">${money(p.price)}</span>
        </div>
      </button>`).join("") : '<p class="empty">No encontramos productos con esa búsqueda.</p>';
  }

  $("grid").addEventListener("click", (e) => {
    const b = e.target.closest(".item");
    if (b) open(PRODUCTOS.find((p) => p.code === b.dataset.code));
  });

  let current, size, color;
  function open(p) {
    current = p; size = null; color = null;
    $("gal").innerHTML = p.imgs.map((src) => `<img src="${src}" alt="${p.name}">`).join("");
    $("gal").scrollLeft = 0;
    $("dots").innerHTML = p.imgs.length > 1 ? p.imgs.map((_, i) => `<span class="${i ? "" : "on"}"></span>`).join("") : "";
    $("dCode").textContent = "ART. " + p.code;
    $("dName").textContent = p.name;
    $("dPrice").textContent = money(p.price);
    const sizes = p.sizes.split(/\s*-\s*/).filter(Boolean);
    $("dSizes").innerHTML = sizes.map((s) => `<button class="opt" type="button" aria-pressed="false" data-v="${s}">${s}</button>`).join("");
    $("dColors").innerHTML = p.colors.map((c) => `<button class="opt" type="button" aria-pressed="false" data-v="${c}">${nice(c)}</button>`).join("");
    updateWa();
    $("dlg").showModal();
  }
  function pick(box, setter) {
    box.addEventListener("click", (e) => {
      const b = e.target.closest(".opt");
      if (!b) return;
      const on = b.getAttribute("aria-pressed") !== "true";
      box.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", on);
      setter(on ? b.dataset.v : null);
      updateWa();
    });
  }
  pick($("dSizes"), (v) => size = v);
  pick($("dColors"), (v) => color = v && nice(v));
  function updateWa() {
    const p = current;
    let t = `¡Hola! Quiero el ART. ${p.code} – ${nice(p.name)} (${money(p.price)}).`;
    if (size) t += `\nTalle: ${size}`;
    if (color) t += `\nColor: ${color}`;
    $("dWa").href = waLink(t);
  }
  $("gal").addEventListener("scroll", () => {
    const i = Math.round($("gal").scrollLeft / $("gal").clientWidth);
    [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
  }, { passive: true });

  $("btnTalles").addEventListener("click", () => $("dlgTalles").showModal());
  document.querySelectorAll("dialog").forEach((d) => {
    d.addEventListener("click", (e) => { if (e.target === d || e.target.closest("[data-close]")) d.close(); });
  });

  render();
</script>
</body>
</html>
